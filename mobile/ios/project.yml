name: Domofon
options:
  bundleIdPrefix: ru.domofon
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.0"
  MobileVLCKit:
    # SwiftPM-зеркало MobileVLCKit для RTSP-плеера панели DNAKE.
    url: https://github.com/videolan/vlckit
    branch: master

targets:
  Domofon:
    type: application
    platform: iOS
    sources:
      - Domofon
    info:
      path: Domofon/Info.plist
      properties:
        CFBundleDisplayName: Домофон
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Для видеозвонков с домофона
        NSMicrophoneUsageDescription: Для голосовой связи с посетителем
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
          - voip
    entitlements:
      path: Domofon/Domofon.entitlements
      properties:
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.domofon.app
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: KeychainAccess
      - package: SocketIO
        product: SocketIO
      - package: MobileVLCKit
        product: MobileVLCKit
