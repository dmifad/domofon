; PJSIP-конфиг для MVP с одной панелью DNAKE S213 и одним мобильным клиентом.
;
; Замените:
;   <EXTERNAL_IP>     — публичный IP сервера (или LAN-адрес, если всё в одной сети)
;   <PANEL_PASS>      — пароль, который вы зададите в S213 (Settings → SIP Account)
;   <MOBILE_PASS>     — пароль для мобильного клиента
;
; После правки: docker compose restart asterisk

[global]
type=global
user_agent=Domofon Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; раскомментируйте, если сервер за NAT и есть публичный IP
;external_media_address=<EXTERNAL_IP>
;external_signaling_address=<EXTERNAL_IP>

; ===== DNAKE S213 (панель) =====

[panel1]
type=endpoint
context=from-intercom
disallow=all
allow=ulaw,alaw,h264                  ; S213 умеет H.264 видео
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
trust_id_inbound=yes
auth=panel1-auth
aors=panel1-aor

[panel1-auth]
type=auth
auth_type=userpass
username=panel1
password=<PANEL_PASS>

[panel1-aor]
type=aor
max_contacts=1
remove_existing=yes

; ===== Мобильный клиент жителя =====

[user1]
type=endpoint
context=from-mobile
disallow=all
allow=opus,ulaw,alaw,h264
ice_support=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_use_received_transport=yes
auth=user1-auth
aors=user1-aor

[user1-auth]
type=auth
auth_type=userpass
username=user1
password=<MOBILE_PASS>

[user1-aor]
type=aor
max_contacts=4         ; один житель — Android + iOS = до 4 регистраций
remove_existing=yes
qualify_frequency=30
