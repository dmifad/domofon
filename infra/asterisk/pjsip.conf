; Sample PJSIP config for Domofon. Production should use a per-tenant template.

[global]
type=global
user_agent=Domofon Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key

; ===== Intercoms (панели) =====

[intercom-template](!)
type=endpoint
context=from-intercom
disallow=all
allow=ulaw,alaw,h264
direct_media=no
trust_id_inbound=yes

[panel1](intercom-template)
auth=panel1-auth
aors=panel1-aor

[panel1-auth]
type=auth
auth_type=userpass
username=panel1
password=change-me-panel1

[panel1-aor]
type=aor
max_contacts=1
remove_existing=yes

; ===== Mobile clients (жители) =====
; Динамические endpoints создаются скриптом по аккаунту пользователя:
;   pjsip_endpoint_identifier_ip + auth_username.
; Здесь — пример статической записи для разработки.

[mobile-template](!)
type=endpoint
context=from-mobile
disallow=all
allow=opus,ulaw,alaw,h264,vp8
ice_support=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_use_received_transport=yes
webrtc=yes

[user-dev](mobile-template)
auth=user-dev-auth
aors=user-dev-aor

[user-dev-auth]
type=auth
auth_type=userpass
username=user-dev
password=change-me-user-dev

[user-dev-aor]
type=aor
max_contacts=4
remove_existing=yes
qualify_frequency=30
