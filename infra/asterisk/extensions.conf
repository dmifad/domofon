; Dialplan для Domofon.
; Поток: панель → from-intercom → webhook backend → backend возвращает SIP-URI группового вызова → Dial.

[globals]
BACKEND_URL=http://backend:3000/api/v1
INTERNAL_SECRET=dev-internal-secret
RING_TIMEOUT=30

[from-intercom]
; Панель набирает номер квартиры. Соответствует apartment.number в БД.
exten => _XXXX,1,NoOp(Incoming call from intercom ${CHANNEL(name)} to apartment ${EXTEN})
 same => n,Set(CURL_HTTPHEADER=Content-Type: application/json|X-Internal-Secret: ${INTERNAL_SECRET})
 same => n,Set(JSON={"intercomId":"${INTERCOM_ID}","apartmentNumber":"${EXTEN}","channelId":"${CHANNEL(name)}"})
 same => n,Set(RESPONSE=${CURL(${BACKEND_URL}/internal/calls/incoming,${JSON})})
 same => n,Set(CALL_ID=${JSONELEMENT(RESPONSE,callId)})
 same => n,Set(SIP_URI=${JSONELEMENT(RESPONSE,sipUri)})
 same => n,NoOp(Backend created call ${CALL_ID}, dialing ${SIP_URI})
 ; SIP_URI указывает на группу регистраций мобильных клиентов (см. extensions для исходящего).
 same => n,Dial(PJSIP/${SIP_URI},${RING_TIMEOUT},rtT)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?ok:missed)
 same => n(missed),Set(JSON_END={"callId":"${CALL_ID}"})
 same => n,Set(_=${CURL(${BACKEND_URL}/internal/calls/missed,${JSON_END})})
 same => n,Hangup()
 same => n(ok),Set(JSON_END={"callId":"${CALL_ID}"})
 same => n,Set(_=${CURL(${BACKEND_URL}/internal/calls/end,${JSON_END})})
 same => n,Hangup()

; Открытие двери из активного звонка через DTMF '#' — Asterisk шлёт SIP INFO панели.
exten => h,1,NoOp(Call ended for ${CHANNEL(name)})

[from-mobile]
; Если житель хочет дозвониться до диспетчера/портье — отдельный контекст.
exten => _X.,1,NoOp(Mobile dialed ${EXTEN})
 same => n,Hangup()
