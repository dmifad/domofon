; Dialplan MVP.
;
; Поток:
;   1) Панель S213 набирает 101 (любой extension) — попадает в [from-intercom].
;   2) Dialplan вызывает webhook backend POST /internal/calls/incoming
;      (получает {callId, dial}).
;   3) Dial(PJSIP/user1) — параллельно звонит на все регистрации жителя.
;   4) По завершению — webhook /internal/calls/ended или /internal/calls/missed.
;
; Backend URL и секрет передаются через переменные globals (см. ниже).

[globals]
BACKEND_URL=http://host.docker.internal:3000/api/v1
INTERNAL_SECRET=dev-internal-secret
RING_TIMEOUT=30

[from-intercom]
exten => _X.,1,NoOp(Incoming from panel ${CHANNEL(name)})
 same => n,Set(JSON={"intercomId":"panel1","channelId":"${CHANNEL(name)}"})
 same => n,Set(CURL(${BACKEND_URL}/internal/calls/incoming,${JSON})=)
 same => n,Set(RESP=${CURL(${BACKEND_URL}/internal/calls/incoming,${JSON},content-type:application/json,X-Internal-Secret:${INTERNAL_SECRET})})
 same => n,Set(CALL_ID=${JSONELEMENT(RESP,callId)})
 same => n,Set(DIAL=${JSONELEMENT(RESP,dial)})
 same => n,NoOp(Backend created call ${CALL_ID}, dialing ${DIAL})
 same => n,Dial(PJSIP/${DIAL},${RING_TIMEOUT},rtT)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?ok:missed)
 same => n(missed),Set(_=${CURL(${BACKEND_URL}/internal/calls/missed,{"callId":"${CALL_ID}"},content-type:application/json,X-Internal-Secret:${INTERNAL_SECRET})})
 same => n,Hangup()
 same => n(ok),Set(_=${CURL(${BACKEND_URL}/internal/calls/ended,{"callId":"${CALL_ID}"},content-type:application/json,X-Internal-Secret:${INTERNAL_SECRET})})
 same => n,Hangup()

[from-mobile]
exten => _X.,1,Hangup()
