services:
  asterisk:
    image: mlan/asterisk:stable
    hostname: asterisk
    network_mode: host        # для прямого SIP/RTP в LAN с панелью
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - asterisk_data:/var/lib/asterisk
    restart: unless-stopped

  # MediaMTX опционален — только если нужно проксировать RTSP-поток
  # с панели наружу LAN (например, для удалённого просмотра через интернет).
  # mediamtx:
  #   image: bluenviron/mediamtx:latest
  #   ports:
  #     - "8554:8554"
  #     - "8888:8888"
  #   volumes:
  #     - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro

volumes:
  asterisk_data:
